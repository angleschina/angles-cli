name: 🐛 Bug 报告
description: 提交一个缺陷报告，帮助我们修复 angles-cli 的问题。
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "感谢你花时间报告缺陷！请尽量填写完整信息，带 <kbd>*</kbd> 的为必填项。"

  - type: input
    id: version
    attributes:
      label: angles-cli 版本
      description: "运行 `angles-cli --version` 可查看当前版本号。"
      placeholder: "例如 v0.6.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台 / 操作系统
      multiple: true
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux x86_64
        - Linux aarch64
        - Windows x86_64
        - iSH (iPadOS / iOS)
        - 其他
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 触发方式
      options:
        - CLI 交互模式 (交互式 shell)
        - `angles-cli run "任务"` 单次任务
        - HTTP API (angles serve)
        - 工具调用 (websearch / fetchpage / shell 等某个 tool)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: "描述你期望发生什么。"
      placeholder: "例如：调用 websearch 应返回可读的搜索结果摘要文本……"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: "描述实际发生了什么，最好附上报错输出 / 日志 / 崩溃堆栈。"
      placeholder: "例如：命令只返回 `搜索: https://...` 或直接 exit 1……"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: "尽量给出最小可复现步骤（命令原文），贴代码块更佳。"
      placeholder: |
        1. 运行某个命令
        2. 复制的异常输出
        3. 观察到的错误结果
      value: "```bash\n\n```"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: LLM 模型 / 端点
      description: "非必须，仅当你怀疑与模型/API 响应格式相关时填写。"
      placeholder: "例如 agnes-2.5-flash"

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 配置文件
      description: "如方便，贴关键日志或脱敏后的配置片段。注意不要泄露 API Key 等敏感信息！"

  - type: checkboxes
    id: checks
    attributes:
      label: 检查清单
      description: 提交前请逐项勾选
      options:
        - label: 我已搜索现有 issues 确认没有重复
          required: true
        - label: 我已确认发布版本是最新的 v0.6.0（或描述复现所用的版本）
          required: false
    validations:
      required: false
