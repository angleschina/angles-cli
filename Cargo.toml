## angles-cli v0.5.1 发布：Windows 终端 UTF-8 乱码修复 (2026-08-21)
- **Bug**: Win 版 `angles.exe` 在 CMD/PowerShell 输出中文乱码
- **根因**: Rust 二进制默认写 UTF-8, Windows 终端默认 OEM 编码(CP 437/936等), 不匹配
- **修法**: 
  - Cargo.toml: 新增 `windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }`, 仅 windows cfg 编译
  - src/main.rs: `#[cfg(windows)] fn setup_console_utf8()` 调用 `SetConsoleOutputCP(65001)` 强制 UTF-8
- **发布**: GitHub tag v0.5.1 (commit 9fa3f27), Actions Release workflow 触发
- **npm**: @angleschina/angles@0.5.1 (待发布, 需 npm config set + publish)
- **关键操作** (沿用 v0.5.0 路径):
  - push 走 ghfast.top 镜像: `git remote set-url origin "https://${GITHUB_TOKEN}@ghfast.top/https://github.com/ZSJ305/angles-cli.git"`
  - tag 后还原 remote 为公开 URL
  - npm publish 同 v0.5.0 配方
- **Release workflow**: push tags v* 触发, 编 aarch64/x86_64 Linux/macOS + win x64
